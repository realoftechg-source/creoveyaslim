<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  // Tags <html> before any content paints, so the desktop-app styling applies immediately.
  if (/CreoveyaDesktopApp/.test(navigator.userAgent)) document.documentElement.classList.add('desktop-app');
</script>
<title>Create Account — Creoveya</title>
<meta name="description" content="Create your Creoveya account and start going live with real-time AI looks.">
<link rel="canonical" href="https://creoveya.com/register.html">
<!-- Open Graph / WhatsApp Link Preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Create Account — Creoveya">
<meta property="og:description" content="Create your Creoveya account and start going live with real-time AI looks.">
<meta property="og:url" content="https://creoveya.com/register.html">
<meta property="og:image" content="https://creoveya.com/img/og-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Creoveya — Go live as anyone">
<meta property="og:site_name" content="Creoveya">
<meta property="og:locale" content="en_US">
<!-- Twitter compatibility -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Create Account — Creoveya">
<meta name="twitter:description" content="Create your Creoveya account and start going live with real-time AI looks.">
<meta name="twitter:image" content="https://creoveya.com/img/og-preview.jpg">
<meta name="theme-color" content="#1a1714">
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
<nav class="navbar auth-web-nav"><div class="navbar-inner">
  <a class="brand" href="/"><img src="/img/logo.svg" class="brand-mark" alt="Creoveya">Creoveya</a>
  <a href="/" class="btn btn-outline btn-sm">Back to Home</a>
</div></nav>

<div class="auth-shell">
  <div class="desktop-app-brand">
    <img src="/img/logo.svg" alt="Creoveya">
    <div class="desktop-app-brand-text">
      <strong>Creoveya</strong>
      <span>AI Live Studio</span>
    </div>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab" onclick="location.href='/login.html'">Sign In</div>
      <div class="auth-tab active" onclick="location.href='/register.html'">Create Account</div>
    </div>
    <h2>Create your <em>account.</em></h2>
    <p class="text-muted" style="margin-bottom:22px;">Takes less than a minute.</p>
    <div class="error-banner" id="err"></div>
    <form id="registerForm" autocomplete="on">
      <div class="hp-field" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <p class="text-muted" style="font-size:.8rem; margin-top:4px;">At least 8 characters.</p>
      </div>
      <div id="captchaMount"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create Account</button>
    </form>
    <div class="auth-divider hidden" id="googleDivider">or</div>
    <div id="googleBtnWrap" class="hidden"></div>
    <p class="text-muted text-center" style="margin-top:16px; font-size:.85rem;">
      After registering, you'll choose a credit plan and submit payment before you can access the studio.
    </p>
  </div>
  <p class="desktop-app-footer">Creoveya Desktop</p>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script>
  const captcha = initCaptcha(document.getElementById('captchaMount'));
  const errEl = document.getElementById('err');

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    if (!captcha.require()) return showAuthError(errEl, 'Please tick "I\'m not a robot" first.');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      await apiFetch('/auth/register', {
        method: 'POST',
        body: {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          captchaToken: captcha.token(),
          website: document.getElementById('website').value,
        },
      });
      window.location.href = '/payment';
    } catch (err) {
      showAuthError(errEl, err.message);
      captcha.reset();
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });

  initGoogleLogin(document.getElementById('googleBtnWrap'), document.getElementById('googleDivider'), async (credential) => {
    errEl.classList.remove('show');
    try {
      const data = await apiFetch('/auth/google', { method: 'POST', body: { credential } });
      routeAfterLogin(data.user);
    } catch (err) { showAuthError(errEl, err.message); }
  });
</script>
</body>
</html>
