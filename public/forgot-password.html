<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var t=localStorage.getItem('creoveya_theme');if(t!=='dark'&&t!=='light')t='light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<script>
  // Tags <html> before any content paints, so the desktop-app styling applies immediately.
  if (/CreoveyaDesktopApp/.test(navigator.userAgent)) document.documentElement.classList.add('desktop-app');
</script>
<title>Forgot Password — Creoveya</title>
<meta name="description" content="Reset your Creoveya password.">
<link rel="canonical" href="https://creoveya.com/forgot-password.html">
<!-- Open Graph / WhatsApp Link Preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Forgot Password — Creoveya">
<meta property="og:description" content="Reset your Creoveya password.">
<meta property="og:url" content="https://creoveya.com/forgot-password.html">
<meta property="og:image" content="https://creoveya.com/img/og-preview.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Creoveya — Go live as anyone">
<meta property="og:site_name" content="Creoveya">
<meta property="og:locale" content="en_US">
<!-- Twitter compatibility -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Forgot Password — Creoveya">
<meta name="twitter:description" content="Reset your Creoveya password.">
<meta name="twitter:image" content="https://creoveya.com/img/og-preview.jpg">
<meta name="theme-color" content="#1a1714">
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body>
<nav class="navbar auth-web-nav"><div class="navbar-inner">
  <a class="brand" href="/"><img src="/img/logo.svg" class="brand-mark" alt="Creoveya">Creoveya</a>
  <a href="/" class="btn btn-outline btn-sm">Back to Home</a>
</div></nav>

<div class="auth-shell">
  <div class="desktop-app-brand">
    <img src="/img/logo.svg" alt="Creoveya">
    <div class="desktop-app-brand-text">
      <strong>Creoveya</strong>
      <span>AI Live Studio</span>
    </div>
  </div>
  <div class="auth-card">
    <h2>Forgot your <em>password?</em></h2>
    <p class="text-muted" style="margin-bottom:22px;">Enter your username or email and we'll send you a link to choose a new one. It works for admin accounts too.</p>
    <div class="error-banner" id="err"></div>
    <p class="success-banner" id="okMsg"></p>
    <form id="forgotForm" autocomplete="on">
      <div class="hp-field" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="form-group">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div id="captchaMount"></div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
    </form>
    <p class="text-center" style="margin:18px 0 0; font-size:.9rem;"><a href="/login.html" class="link-muted">← Back to sign in</a></p>
  </div>
  <p class="desktop-app-footer">Creoveya Desktop</p>
</div>

<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
<script>
  const captcha = initCaptcha(document.getElementById('captchaMount'));
  const errEl = document.getElementById('err');
  const okEl = document.getElementById('okMsg');
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show'); okEl.classList.remove('show');
    if (!captcha.require()) return showAuthError(errEl, 'Please tick "I\'m not a robot" first.');
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const data = await apiFetch('/auth/forgot', {
        method: 'POST',
        body: { identifier: document.getElementById('identifier').value, captchaToken: captcha.token(), website: document.getElementById('website').value },
      });
      okEl.textContent = data.message; okEl.classList.add('show');
      btn.textContent = '✓ Link sent';
      document.getElementById('forgotForm').querySelectorAll('input').forEach((i) => { i.disabled = true; });
    } catch (err) {
      showAuthError(errEl, err.message);
      captcha.reset();
      btn.disabled = false; btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
